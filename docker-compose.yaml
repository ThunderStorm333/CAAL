# CAAL Voice Framework - Docker Compose Stack (Cloud APIs Version)
# ================================================================
#
# This version uses cloud APIs instead of local GPU services:
# - Google Cloud STT (Speech-to-Text)
# - Google Cloud TTS (Text-to-Speech)  
# - Gemini LLM via geminicli2api proxy (uses your Google AI Pro subscription)
#
# Usage:
#   docker compose up -d
#   Access: http://<CAAL_HOST_IP>:3000
#
# Prerequisites:
#   1. Copy credentials/gcp-service-account.json.example to credentials/gcp-service-account.json
#   2. Copy credentials/gemini-oauth.json.example to credentials/gemini-oauth.json
#   3. Copy .env.example to .env and update values
#
# See .env.example for configuration options.

services:
  # ===========================================================================
  # LiveKit Server - WebRTC Infrastructure
  # ===========================================================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: caal-livekit
    command: --config /etc/livekit.yaml --node-ip ${CAAL_HOST_IP}
    ports:
      - "7880:7880"       # WebSocket
      - "7881:7881"       # TCP for WebRTC
      - "7881:7881/udp"   # UDP for WebRTC
      - "50000-50100:50000-50100/udp"  # WebRTC media ports
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      - CAAL_HOST_IP=${CAAL_HOST_IP}
    networks:
      - caal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # geminicli2api - Gemini LLM Proxy (uses your Google AI Pro subscription)
  # ===========================================================================
  # Exposes OpenAI-compatible API using your Gemini CLI OAuth credentials
  geminicli2api:
    image: gzzhongqi/geminicli2api:latest
    container_name: caal-geminicli2api
    ports:
      - "8888:8888"
    environment:
      - GEMINI_AUTH_PASSWORD=${GEMINI_PROXY_PASSWORD:-caal-secret}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/oauth_creds.json
    volumes:
      - ./credentials/gemini-oauth.json:/app/oauth_creds.json:ro
    networks:
      - caal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # CAAL Agent - Voice Processing Pipeline
  # ===========================================================================
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/CoreWorxLab/caal
        org.opencontainers.image.description: CAAL Voice Assistant Agent (Cloud APIs)
    container_name: caal-agent
    ports:
      - "8889:8889"  # Webhook server for announcements and tool reload
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      # Gemini LLM via geminicli2api proxy
      - GEMINI_API_URL=http://geminicli2api:8888/v1
      - GEMINI_API_KEY=${GEMINI_PROXY_PASSWORD:-caal-secret}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash}
      # Google Cloud credentials for STT/TTS
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-service-account.json
      - STT_MODEL=${STT_MODEL:-chirp_2}
      - STT_LANGUAGES=${STT_LANGUAGES:-en-US}
      - TTS_VOICE=${TTS_VOICE:-en-US-Chirp3-HD-Callirrhoe}
      - TTS_MODEL=${TTS_MODEL:-chirp_3}
      # n8n MCP
      - N8N_MCP_URL=${N8N_MCP_URL:-}
      - N8N_MCP_TOKEN=${N8N_MCP_TOKEN:-}
      # General
      - TIMEZONE=${TIMEZONE:-America/New_York}
      - TIMEZONE_DISPLAY=${TIMEZONE_DISPLAY:-Eastern Time}
      - MAX_TURNS=${MAX_TURNS:-20}
      - TOOL_CACHE_SIZE=${TOOL_CACHE_SIZE:-3}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - PORCUPINE_ACCESS_KEY=${PORCUPINE_ACCESS_KEY:-}
    volumes:
      - caal-memory:/app/data
      - ./settings.json:/app/settings.json  # Runtime settings (created on first save)
      - ./prompt:/app/prompt  # Prompt files (custom.md is gitignored)
      - ./mcp_servers.json:/app/mcp_servers.json  # Additional MCP servers (optional)
      - ./credentials/gcp-service-account.json:/app/credentials/gcp-service-account.json:ro
    networks:
      - caal-network
    depends_on:
      livekit:
        condition: service_healthy
      geminicli2api:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # Frontend - Next.js Web Interface
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/CoreWorxLab/caal
        org.opencontainers.image.description: CAAL Voice Assistant Frontend
      args:
        - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL:-}
        - NEXT_PUBLIC_PORCUPINE_ACCESS_KEY=${PORCUPINE_ACCESS_KEY:-}
    container_name: caal-frontend
    ports:
      - "3000:3000"
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL:-}
      - WEBHOOK_URL=http://agent:8889
    networks:
      - caal-network
    depends_on:
      livekit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

# =============================================================================
# Networks
# =============================================================================
networks:
  caal-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  caal-memory:
    name: caal-memory
